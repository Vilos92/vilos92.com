# Runs the project's continuous integration checks: format check, lint,
# typecheck, unit tests, comment-format check, and (on pull requests) a
# fallow audit against the pull request's base branch.
#
# The `greg-zone/bun-git:1.3.14` step image is built locally on the CI host
# from greg-zone/ci/bun-git/Dockerfile. If pulling the image fails, rebuild
# it there.

when:
  - event: pull_request
  - event: push
    branch: main

# A custom clone step must live under this top-level `clone:` key, not
# under `steps:` -- otherwise Woodpecker's own default clone step (a
# shallow, partial clone) still runs first and this one just runs
# alongside it, on top of an already-shallow repo. `partial: false` with
# no `depth` means a full, unshallow clone, which the fallow step needs
# to compute a merge base against the target branch.
clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      partial: false

steps:
  - name: install
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run fmt:check

  - name: lint
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run lint

  - name: typecheck
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run typecheck

  - name: test
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run test

  - name: comment-fmt
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run comment-fmt:check

  - name: fallow
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    when:
      - event: pull_request
    commands:
      # Woodpecker checks out the pull request's head commit directly
      # (not GitHub's synthetic merge commit), so HEAD^1 is only the
      # target branch tip when the PR has exactly one commit. Fetch the
      # target branch explicitly instead; the repo is public, so this
      # needs no credentials.
      - git fetch origin "$CI_COMMIT_TARGET_BRANCH"
      - bun run fallow:audit -- --base FETCH_HEAD
