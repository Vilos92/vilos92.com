# Runs the project's continuous integration checks: format check, lint,
# typecheck, unit tests, comment-format check, and (on pull requests) a
# fallow audit against the base branch.
#
# The `greg-zone/bun-git:1.3.14` step image is built locally on the CI host
# from greg-zone/ci/bun-git/Dockerfile. If pulling the image fails, rebuild
# it there.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      # The fallow audit diffs against a merge base, which a partial clone
      # doesn't have.
      partial: false

  - name: install
    image: greg-zone/bun-git:1.3.14
    commands:
      - bun install --frozen-lockfile

  - name: fmt
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run fmt:check

  - name: lint
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run lint

  - name: typecheck
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run typecheck

  - name: test
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run test

  - name: comment-fmt
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    commands:
      - bun run comment-fmt:check

  - name: fallow
    image: greg-zone/bun-git:1.3.14
    depends_on:
      - install
    when:
      - event: pull_request
    commands:
      # PR pipelines run on GitHub's merge ref, so HEAD^1 is the base
      # branch tip.
      - bun run fallow:audit -- --base 'HEAD^1'
